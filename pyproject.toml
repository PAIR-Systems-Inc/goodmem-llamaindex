[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llamaindex-goodmem"
version = "0.2.0"
description = "Native LlamaIndex retrieval, Document ingestion and agent tools for GoodMem."
authors = [{name = "bashareid"}]
requires-python = ">=3.10,<4.0"
readme = "README.md"
license = "MIT"
keywords = ["llama-index", "goodmem", "memory", "agents", "llm", "vector-search", "semantic-search"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "llama-index-core>=0.14.24,<0.15",
    "goodmem>=0.1.34,<0.2",
    "httpx>=0.28,<1",
]

[project.urls]
Homepage = "https://goodmem.ai"
Repository = "https://github.com/PAIR-Systems-Inc/goodmem-llamaindex"
Documentation = "https://github.com/PAIR-Systems-Inc/goodmem-llamaindex/blob/main/docs/usage.md"
Changelog = "https://github.com/PAIR-Systems-Inc/goodmem-llamaindex/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=1.0.0",
    "ruff>=0.12",
]

[tool.hatch.build.targets.sdist]
include = ["llama_index/"]
exclude = ["**/BUILD", "**/__pycache__"]

[tool.hatch.build.targets.wheel]
include = ["llama_index/"]
exclude = ["**/BUILD", "**/__pycache__"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
